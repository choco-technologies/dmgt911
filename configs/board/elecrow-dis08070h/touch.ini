; Elecrow DIS08070H (CrowPanel ESP32 HMI 7.0", the V3 revision): the capacitive touch panel of the 800x480 display, a GT911 on the I2C bus
; of the board (SDA = GPIO19, SCL = GPIO20: the pads of the USB of the chip, no USB connector is wired to them). Scanned on the board: the
; GT911 answers at 0x5D, the PCA9557 expander at 0x18. The reset line of the GT911 is the pin IO0 of the expander (IO1 is its INT: the
; driver polls, it does not use it).
;
; One friends_group, the one of the display (lcd.ini of dmlcdtft): the display service takes the input of the group of its display. dmdevfs tells
; every driver of the group about the others, and the friend_role says who is who. The touch panel is the
; last section (the order of the sections is the order of the creation and, reversed, of the teardown). dmi2c, dmpca9557 and dmgt911 must be
; loaded. This file defines the bus: do not use the i2c.ini of dmi2c of the board with it.
; width / height: the screen the contacts are reported in - those of the display as shown. swap_xy / mirror_x / mirror_y turn the chip's
; axes to the screen's.

[touch_i2c]
driver_name=dmi2c
driver_order=2
friends_group=lcd
friend_role=i2c
instance=1
role=master
address=93
baudrate=400000
timeout_ms=100
scl_pin=20
sda_pin=19

[touch_reset]
driver_name=dmpca9557
driver_order=3
friends_group=lcd
friend_role=reset
address=24
pin=0
mode=output
state=high

[touch]
driver_name=dmgt911
driver_order=4
friends_group=lcd
width=800
height=480
reset=yes
